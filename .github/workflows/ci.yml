name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build --disable-sandbox

      - name: Checks
        run: ./scripts/test.sh

      - name: Bundle
        run: ./scripts/build-app.sh
